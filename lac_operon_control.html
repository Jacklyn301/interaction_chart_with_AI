<script>
let lactose=true,glucose=false;const $=id=>document.getElementById(id);function update(){let high=lactose&&!glucose,basal=lactose&&glucose,repressed=!lactose;$('lacLabel').textContent=lactose?'present':'absent';$('gluLabel').textContent=glucose?'present':'absent';$('lacBtn').classList.toggle('on',lactose);$('gluBtn').classList.toggle('on',glucose);$('cap').classList.toggle('active',!glucose);$('capSite').classList.toggle('active',!glucose);$('rnapp').classList.toggle('active',high||basal);['z','y','a'].forEach(x=>$(x).classList.toggle('active',high||basal));$('arrow').style.opacity=high?'1':basal?'.55':'.18';$('mrna').style.opacity=high?'1':basal?'.55':'.18';if(repressed){$('rep').textContent='LacI on operator 🛑';$('rep').classList.add('active');$('op').classList.add('active');$('status').textContent='OFF';$('msg').textContent='No lactose: LacI 結合到operator並抑制轉錄';$('explain').innerHTML='<b>Negative control:</b> LacI 結合到 operator. CAP 即使可能因為葡萄糖濃度低而活化，但是repressor還是擋住，阻止 lacZYA transcription.'}else if(basal){$('rep').textContent='LacI 釋放';$('rep').classList.remove('active');$('op').classList.remove('active');$('status').textContent='轉錄情形較低';$('msg').textContent='Lactose 移除了repressor, 但是高濃度葡萄糖導致cAMP濃度不高，CAP較不活化';$('explain').innerHTML='<b>Mixed state:</b> lactose → 產生allolactose → LacI 離開 operator. Glucose 濃度高 → cAMP 濃度低 → CAP 活性低，轉錄狀態依然較低'}else{$('rep').textContent='LacI + allolactose';$('rep').classList.remove('active');$('op').classList.remove('active');$('status').textContent='轉錄水平增高';$('msg').textContent='Allolactose 將 LacI 從 operator 上移開，低濃度葡萄糖使 cAMP 水平增高，活化 CAP';$('explain').innerHTML='<b>Both controls favor transcription:</b> lactose 去除了 negative control，低濃度 glucose 提高 cAMP水平，CAP–cAMP 主要提供 positive control 幫忙促進 lacZYA transcription 的活化'}}$('lacBtn').onclick=()=>{lactose=!lactose;update()};$('gluBtn').onclick=()=>{glucose=!glucose;update()};update();
</script>
